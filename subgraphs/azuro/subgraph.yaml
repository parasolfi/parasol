specVersion: 0.0.7
description: Parasol — standardized prediction-market index (Azuro venue)
repository: https://github.com/parasolfi/parasol
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: LiveCore
    # The address published as "ClientCore" on Azuro's own deployment-addresses
    # page turned out to actually be a LiveCore contract (live/in-play betting),
    # not the pre-match Core its docs implied — confirmed by pulling 382 real
    # logs from this address and matching their topic0 hashes against every
    # ABI in Azuro's own public-config repo. Only ConditionCreated matched
    # cleanly against a confirmed real on-chain event; a second event,
    # ConditionUpdated, matched too but its field semantics couldn't be
    # confirmed (see mapping.ts) so it's deliberately not wired up. Docs pages
    # for fast-moving protocols lag deployed bytecode — verify against real
    # logs, not the docs page, before trusting an address+ABI pairing.
    network: matic
    source:
      address: "0xF9548Be470A4e130c90ceA8b179FCD66D2972AC7"
      abi: LiveCore
      startBlock: 90850000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Outcome
      abis:
        - name: LiveCore
          file: ./abis/LiveCore.json
      eventHandlers:
        - event: ConditionCreated(indexed uint256,indexed uint256,uint128[],uint64[],uint8)
          handler: handleConditionCreated
      file: ./src/mapping.ts
