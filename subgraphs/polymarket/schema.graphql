# Canonical prediction-market schema, shared verbatim across every venue subgraph
# (polymarket, omen, seer, azuro, ...). This file is the source of truth — each
# venue folder keeps an identical copy (subgraphs/<venue>/schema.graphql) because
# Subgraph Studio deploys need their own schema.graphql per deployment. If you
# change this file, copy it over the per-venue ones too, or the venues drift out
# of the "standardized schema" story the Graph track is judged on.
#
# The rule: every type defined here must exist, identically, in every venue's
# copy — that's the standardized surface judges/consumers query. A venue MAY
# append its own additional internal helper entities beyond this baseline
# (e.g. azuro/schema.graphql has one for resolving its raw outcome ids) — those
# are implementation plumbing, not part of the common API, so they don't need
# to be copied everywhere.

type Market @entity(immutable: true) {
  id: ID! # "<venue>-<conditionId>" — globally unique across venues
  venue: String! # "polymarket" | "omen" | "seer" | "azuro"
  venueConditionId: String! # the venue's own condition/market identifier — a hex
  # bytes32 string for CTF venues, a decimal uint256 string for Azuro. String
  # rather than Bytes because it isn't the same underlying type across venues.
  questionId: Bytes # CTF questionId (raw, on-chain hash) — null for non-CTF
  # venues (Azuro has no equivalent concept; it identifies markets by
  # gameId+conditionId, not a separate opaque question hash).
  question: String # human-readable text, if/when enriched from an off-chain
  # metadata source (e.g. Polymarket's Gamma API). NOT populated by the mapping
  # itself — on-chain events never carry question text. Leave null otherwise.
  outcomeSlotCount: Int!
  oracle: Bytes! # address that resolves this condition
  outcomes: [Outcome!]! @derivedFrom(field: "market")
  resolution: Resolution @derivedFrom(field: "market")
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

type Outcome @entity(immutable: false) {
  id: ID! # "<market.id>-<outcomeIndex>"
  market: Market!
  outcomeIndex: Int!
  label: String! # "Outcome 0" / "Outcome 1" unless the venue exposes real labels
  impliedProbability: BigDecimal! # 0..1, derived per-venue (trade price, odds, etc.)
  lastUpdatedAt: BigInt!
  lastUpdatedBlock: BigInt!
  venueOutcomeId: String # the venue's own raw outcome identifier, if it has one
  # distinct from array position (e.g. Azuro's global outcome ids). Null where
  # position alone is the identifier (e.g. CTF's binary 0/1 indexSet venues).
  volume: BigDecimal! # cumulative traded/bet size in collateral units (e.g. USDC)
  tradeCount: Int! # number of fills/bets seen on this outcome
  rawInverseOdds: BigDecimal # 1/decimalOdds before de-vig normalization — only
  # meaningful for odds-quoted venues (Azuro); null for trade-price venues
  # (Polymarket), which have no separate "raw" vs "de-vigged" distinction.
  priceHistory: [PricePoint!]! @derivedFrom(field: "outcome")
}

# One row per price-changing event — lets you chart an outcome's implied
# probability over time instead of only ever seeing the latest value.
type PricePoint @entity(immutable: true) {
  id: ID! # "<outcome.id>-<block>-<logIndex>"
  outcome: Outcome!
  impliedProbability: BigDecimal!
  timestamp: BigInt!
  block: BigInt!
}

type Resolution @entity(immutable: false) {
  id: ID! # same as market.id
  market: Market!
  status: String! # "Pending" | "Resolved" | "Disputed"
  resolutionSource: String! # "UMA" | "AzuroOracle" | "InternalCTF" | raw oracle address
  winningOutcomeIndex: Int
  finalizedAt: BigInt
}

# Internal lookup: ERC1155 CTF position id -> which Market/outcome it represents.
# Populated at market-creation time via on-chain getCollectionId/getPositionId
# contract calls (NOT reimplemented locally — modern CTF derives collection ids
# as elliptic-curve points, not a plain hash, so we ask the contract instead of
# recomputing it). Shared by every CTF-native venue (Polymarket, Omen, Seer).
type TokenToOutcome @entity(immutable: true) {
  id: ID! # ERC1155 positionId, decimal string
  market: Market!
  outcomeIndex: Int!
}
