specVersion: 0.0.6
description: Parasol — standardized prediction-market index (Polymarket venue)
repository: https://github.com/parasolfi/parasol
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ConditionalTokens
    network: matic
    source:
      address: "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
      abi: ConditionalTokens
      # ~36h back from chain head (~90,878,456 as of 2026-07-26). Pulled back in
      # from a ~4-day window (90705000) — with 4 data sources now (this one,
      # Exchange, NegRiskCtfExchange, NegRiskAdapter) the wider window wasn't
      # converging fast enough. This does mean most NegRisk questions currently
      # trading were "prepared" (QuestionPrepared, see NegRiskAdapter source
      # below) before this window and won't get a TokenToOutcome entry — a
      # real, accepted trade-off for convergence time, not an oversight.
      startBlock: 90813000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Outcome
        - Resolution
        - TokenToOutcome
      abis:
        - name: ConditionalTokens
          file: ./abis/ConditionalTokens.json
      eventHandlers:
        - event: ConditionPreparation(indexed bytes32,indexed address,indexed bytes32,uint256)
          handler: handleConditionPreparation
        - event: ConditionResolution(indexed bytes32,indexed address,indexed bytes32,uint256,uint256[])
          handler: handleConditionResolution
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: Exchange
    # CTF Exchange V2 (0xE111...B996B) — current/audited contract per Polymarket's
    # own docs, NOT the V1 address (0x4bFb...982E) used by their older reference
    # subgraph. V1 and V2 have incompatible OrderFilled shapes — see the ABI here,
    # hand-built from ctf-exchange-v2's Events.sol since Polygonscan's ABI API
    # needs a key we don't have. Re-verify against a real key before relying on
    # this for the actual demo.
    network: matic
    source:
      address: "0xE111180000d2663C0091e4f400237545B87B996B"
      abi: Exchange
      startBlock: 90813000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Outcome
      abis:
        - name: Exchange
          file: ./abis/Exchange.json
      eventHandlers:
        - event: OrderFilled(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
          handler: handleOrderFilled
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: NegRiskCtfExchange
    # Weather/threshold markets settle here, not on the plain Exchange above —
    # confirmed by decoding real logs: this address's dominant event (56k of
    # 103k logs in one sample window) hashes to the exact same OrderFilled
    # signature as the plain Exchange ABI, so it's reused as-is below. What's
    # NOT reusable is token-id derivation — see NegRiskAdapter.
    network: matic
    source:
      address: "0xe2222d279d744050d28e00520010520000310F59"
      abi: Exchange
      startBlock: 90813000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Outcome
      abis:
        - name: Exchange
          file: ./abis/Exchange.json
      eventHandlers:
        - event: OrderFilled(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256,uint256,uint256,bytes32,bytes32)
          handler: handleOrderFilled
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: NegRiskAdapter
    # NegRisk (bundled/threshold) markets do NOT use CTF's plain
    # getCollectionId/getPositionId derivation for their traded token ids —
    # confirmed by computing both for a real market and getting a mismatch
    # against Polymarket's actual reported clobTokenIds. The correct derivation
    # lives here instead: getPositionId(questionId, outcome). questionId only
    # comes from this contract's own QuestionPrepared event (rare — see the
    # startBlock note above), not from anything on the plain CTF contract.
    network: matic
    source:
      address: "0xd91E80cF2E7be2e162c6513ceD06f1dD0dA35296"
      abi: NegRiskAdapter
      startBlock: 90813000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenToOutcome
        - Resolution
      abis:
        - name: NegRiskAdapter
          file: ./abis/NegRiskAdapter.json
      eventHandlers:
        - event: QuestionPrepared(indexed bytes32,indexed bytes32,uint256,bytes)
          handler: handleQuestionPrepared
        - event: OutcomeReported(indexed bytes32,indexed bytes32,bool)
          handler: handleOutcomeReported
      file: ./src/mapping.ts
